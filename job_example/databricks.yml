# Databricks Asset Bundle: job_example
#
# A minimal "hello DABs" bundle that:
#   - Defines a serverless job with one task
#   - Demonstrates a bundle variable (`catalog`) the customer can override
#     per target or at the CLI with `--var catalog=...`
#   - Declares a PyPI Python dependency (`faker`) in the task's
#     serverless environment, so we show how dependency management works
#     without classic clusters or init scripts.
#
# Two targets:
#   - dev:  fe-sandbox workspace (development mode, per-user prefix)
#   - prod: e2-demo-field-eng workspace (production mode)

bundle:
  name: dabs_demo_job

include:
  - resources/*.yml

# ----------------------------------------------------------------------------
# Variables — what the customer can override per target or at the CLI.
# ----------------------------------------------------------------------------
variables:
  catalog:
    description: |
      Unity Catalog the job writes into. Override per target below, or at the
      CLI: `databricks bundle deploy --var catalog=my_catalog`.
    default: zg_aws_sandbox_catalog

  schema:
    description: Schema inside the catalog. The job will create it if missing.
    default: dabs_demo

  row_count:
    description: How many synthetic rows the job generates.
    default: "1000"

# ----------------------------------------------------------------------------
# Targets — one workspace per environment.
# ----------------------------------------------------------------------------
targets:
  # ---- dev -----------------------------------------------------------------
  # Development mode: per-user resource prefix, schedules paused, root path
  # under the deploying user's home directory.
  dev:
    mode: development
    default: true
    workspace:
      host: https://fe-sandbox-zg-aws-sandbox.cloud.databricks.com
      profile: dabs-demo-dev
    variables:
      catalog: zg_aws_sandbox_catalog   # the fe-sandbox workspace's managed UC catalog

  # ---- prod ----------------------------------------------------------------
  # Production mode: no username prefix, run_as must be set (here we use the
  # deploying user; in a real prod setup you'd use a service principal).
  prod:
    mode: production
    workspace:
      host: https://fevm-dabs-prod.cloud.databricks.com
      profile: dabs-demo-prod
      # Explicit root_path is recommended for production mode — keeps the
      # deploy idempotent and tied to a specific identity.
      root_path: /Workspace/Users/zach.goehring@databricks.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: dabs_prod_catalog        # the fe-vm prod workspace's managed UC catalog
    run_as:
      user_name: zach.goehring@databricks.com

    # Customer-shaped extension point: in a real prod target, this is where
    # you'd attach a serverless budget policy so compute spend rolls up
    # under the policy and inherits its tags. Omitted here because the
    # fe-vm workspace's account doesn't have a policy we can reference.
    #
    # resources:
    #   jobs:
    #     generate_customers:
    #       budget_policy_id: <your-policy-uuid>
