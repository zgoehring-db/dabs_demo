# Databricks Asset Bundle: app_example
#
# Deploys a minimal Streamlit "hello world" Databricks App.
#
# Three files make the app work:
#   - app/app.py          → the Streamlit code
#   - app/app.yaml        → tells Databricks how to launch the app
#   - app/requirements.txt → pip dependencies (streamlit)
#
# The bundle resource below just tells Databricks where the source code
# lives and what to call the app in the workspace.

bundle:
  name: dabs_demo_app

resources:
  apps:
    hello_app:
      name: "${bundle.target}-dabs-demo-hello-app"
      source_code_path: ./app
      description: "Streamlit chat app calling a Databricks Foundation Model endpoint."

      # Resource bindings. Each entry grants the app's auto-provisioned
      # service principal a specific permission on a real workspace
      # resource. At runtime, the binding shows up as injected env vars
      # the SDK uses automatically.
      resources:
        - name: chat_model
          description: "Foundation Model endpoint the chat UI calls."
          serving_endpoint:
            name: databricks-meta-llama-3-3-70b-instruct
            permission: CAN_QUERY

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fe-sandbox-zg-aws-sandbox.cloud.databricks.com
      profile: dabs-demo-dev

  prod:
    mode: production
    workspace:
      host: https://fevm-dabs-prod.cloud.databricks.com
      profile: dabs-demo-prod
      # Explicit root_path is recommended for production mode — keeps the
      # deploy idempotent and tied to a specific identity.
      root_path: /Workspace/Users/zach.goehring@databricks.com/.bundle/${bundle.name}/${bundle.target}
    run_as:
      user_name: zach.goehring@databricks.com
